<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Ruta Analista</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700&display=swap">
<style>
/* Layout: app de una columna (máx 520px) con barra superior de racha/XP, ruta en zigzag de lecciones y barra flotante de pestañas abajo.
   Formas inspiradas en plush-ui: superficies sin bordes, sombras suaves, píldoras y resortes al pulsar.
   Paleta de tres colores: crema (fondos), azul noche (texto, acción principal, Ciber) y rojo (progreso, lo hecho o elegido, Inglés). */
:root{
  --bg:#f7f2e8; --panel:#f1ebde; --surface:#fffdf8; --surface-2:#f0e9db; --fill-strong:#e6dccb; --line:#e8dfcf;
  --fg:#1d3557; --muted:#5c6b82; --faint:#a3a9b3;
  --accent:#1d3557; --on-accent:#fffdf8; --on-accent-2:rgba(255,253,248,.68); --on-accent-track:rgba(255,253,248,.13);
  --sel-a:#d62839; --sel-b:#e8443a; --on-sel:#ffffff;
  --cyber:#1d3557; --cyber-deep:#14263f; --cyber-soft:#dfe5ee;
  --eng:#d62839; --eng-deep:#b81f2e; --eng-soft:#f9dfdc;
  --gold:#d62839; --gold-deep:#b81f2e; --flame:#d62839; --ice:#3d6a9e;
  --ok:#1d3557; --danger:#b81f2e; --lock:#e6dccb; --lock-deep:#a3a9b3;
  --scrim:rgba(29,53,87,.36);
  --shadow-soft:0 1px 2px rgba(29,53,87,.05),0 8px 24px rgba(29,53,87,.06);
  --shadow-knob:0 1px 3px rgba(29,53,87,.18),0 2px 8px rgba(29,53,87,.07);
  --ok-soft:color-mix(in oklab,var(--sel-a) 12%,var(--surface));
  --sel-fill:linear-gradient(135deg,var(--sel-a),var(--sel-b));
  --sel-line:linear-gradient(90deg,var(--sel-a),var(--sel-b));
  --gloss:inset 0 1px 0 rgba(255,255,255,.45);
  --ease-spring:linear(0,0.062,0.203,0.372,0.538,0.683,0.801,0.89,0.952,0.993,1.016,1.028,1.031,1.029,1.025,1.02,1.015,1.01,1.006,1.004,1.002,1,1,0.999,0.999,0.999,1);
  --ease-calm:linear(0,0.051,0.166,0.309,0.452,0.584,0.696,0.787,0.858,0.911,0.949,0.975,0.992,1.002,1.008,1.01,1.011,1.01,1.009,1.007,1.006,1.004,1.003,1.002,1.001,1);
  --dur-spring:730ms; --dur-calm:895ms; --dur-fast:120ms; --dur-fade:200ms;
  --f-display:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;
  --f-body:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:28px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1a2b; --panel:#13233a; --surface:#172a45; --surface-2:#1f3554; --fill-strong:#2a4366; --line:#243b5c;
  --fg:#f7f2e8; --muted:#a9b4c6; --faint:#6f7f98;
  --accent:#f7f2e8; --on-accent:#1d3557; --on-accent-2:rgba(29,53,87,.72); --on-accent-track:rgba(29,53,87,.1);
  --sel-a:#e63946; --sel-b:#f0554a; --on-sel:#ffffff;
  --cyber:#6a97d6; --cyber-deep:#4f7fc0; --cyber-soft:#1f3554;
  --eng:#ef5a5a; --eng-deep:#d62839; --eng-soft:#44222c;
  --gold:#ef5a5a; --gold-deep:#e8545a; --flame:#ef5a5a; --ice:#7fb0e6;
  --ok:#6a97d6; --danger:#e63946; --lock:#2a4366; --lock-deep:#6f7f98;
  --scrim:rgba(4,10,20,.6);
  --shadow-soft:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.24);
  --shadow-knob:0 1px 3px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);
  --gloss:inset 0 1px 0 rgba(255,255,255,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a2b; --panel:#13233a; --surface:#172a45; --surface-2:#1f3554; --fill-strong:#2a4366; --line:#243b5c;
  --fg:#f7f2e8; --muted:#a9b4c6; --faint:#6f7f98;
  --accent:#f7f2e8; --on-accent:#1d3557; --on-accent-2:rgba(29,53,87,.72); --on-accent-track:rgba(29,53,87,.1);
  --sel-a:#e63946; --sel-b:#f0554a; --on-sel:#ffffff;
  --cyber:#6a97d6; --cyber-deep:#4f7fc0; --cyber-soft:#1f3554;
  --eng:#ef5a5a; --eng-deep:#d62839; --eng-soft:#44222c;
  --gold:#ef5a5a; --gold-deep:#e8545a; --flame:#ef5a5a; --ice:#7fb0e6;
  --ok:#6a97d6; --danger:#e63946; --lock:#2a4366; --lock-deep:#6f7f98;
  --scrim:rgba(4,10,20,.6);
  --shadow-soft:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.24);
  --shadow-knob:0 1px 3px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);
  --gloss:inset 0 1px 0 rgba(255,255,255,.3);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;font-weight:500;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit;font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:color-mix(in oklab,currentColor 40%,transparent)}
b,strong{font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 124px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;line-height:1.18;margin:0;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
/* todo lo que se pulsa cede con resorte */
.btn,.node,.qbtn,.info,.chips button,.goalpick button,.box,.tabs button,.trackswitch button{transition:scale var(--dur-spring) var(--ease-spring),background-color var(--dur-fast),box-shadow var(--dur-fade),color var(--dur-fast)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:flex-end;gap:14px;min-height:64px;padding:10px 0}
.trackswitch{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--fill-strong);border-radius:999px;padding:4px;margin-right:auto}
.trackswitch .glide{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--surface);box-shadow:var(--shadow-knob);transition:transform var(--dur-spring) var(--ease-spring),scale var(--dur-spring) var(--ease-spring)}
.trackswitch[data-on="eng"] .glide{transform:translateX(100%)}
.trackswitch:active .glide{scale:.93}
.trackswitch button{position:relative;border:0;background:transparent;border-radius:999px;height:36px;padding:0 16px;font-weight:600;font-size:14px;color:var(--muted)}
.trackswitch button[aria-pressed="true"]{color:var(--fg)}
.stat{display:flex;align-items:center;gap:3px;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.stat svg{width:20px;height:20px}
.stat.flame svg{color:var(--flame)} .stat.flame.off svg{color:var(--faint)}
.stat.ice svg{color:var(--ice)} .stat.xp svg{color:var(--gold)}

/* anillo de progreso */
.pring{position:relative;flex:none;width:var(--s,72px);height:var(--s,72px);display:grid;place-items:center}
.pring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.pring circle{fill:none;stroke-width:9;stroke-linecap:round}
.pring .bgc{stroke:currentColor;opacity:.14}
.pring .fgc{stroke:url(#selg)}
.pring b{position:relative;font-size:calc(var(--s,72px)*.27);font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.pring b small{font-size:.62em;opacity:.6;font-weight:600}

/* hero "sigue aquí": la baldosa oscura */
.hero{margin-top:6px;background:var(--accent);color:var(--on-accent);border-radius:32px;padding:20px}
.hero-head{display:flex;align-items:center;gap:14px}
.hero-head>div:first-child{flex:1;min-width:0}
.hero .eyebrow{color:var(--on-accent-2)}
.hero h2{font-size:22px;margin:3px 0 0}
.hero .next{margin-top:14px;font-size:15px;background:var(--on-accent-track);border-radius:16px;padding:12px 14px;overflow-wrap:anywhere}
.hero code{background:var(--on-accent-track)}
.hero .meta{font-size:13px;font-weight:600;color:var(--on-accent-2);margin-top:10px}
.hero .row{margin-top:14px}
.hero .btn.ghost{background:var(--on-accent-track);color:var(--on-accent)}
.hero .btn.cyber,.hero .btn.eng{background:var(--sel-fill);box-shadow:var(--gloss);color:var(--on-sel)}
.hero :focus-visible{outline-color:var(--on-accent)}

/* path */
.unit{margin-top:28px;background:var(--surface);box-shadow:var(--shadow-soft);border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:center}
.unit-av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:18px}
.unit.cyber .unit-av{background:var(--cyber)} .unit.eng .unit-av{background:var(--eng)}
.unit h2{font-size:18px}
.unit p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.unit .info{margin-left:auto;flex:none;border:0;background:var(--surface-2);color:var(--fg);border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.unit .info:active{scale:.86}
.unit .info svg{width:20px;height:20px}
.unit-body{min-width:0}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;padding:30px 0 8px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node-wrap:has(.bubble){margin-top:30px}
.node{width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;position:relative}
.node:active{scale:.86}
.node svg.ic{width:28px;height:28px}
.node.locked{background:var(--lock);color:var(--lock-deep)}
.node.open{background:var(--surface);box-shadow:var(--shadow-knob)}
.node.open.cyber{color:var(--cyber)} .node.open.eng{color:var(--eng)}
.node.open.cur{background:var(--accent);color:var(--on-accent);box-shadow:none}
.node.done{background:var(--sel-fill);box-shadow:var(--gloss);color:var(--on-sel)}
.node.test{border-radius:24px}
.ring{position:absolute;inset:-9px;pointer-events:none}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--fill-strong)}
.ring .fgc{stroke:url(#selg);stroke-linecap:round}
.bubble{position:absolute;bottom:calc(100% + 14px);white-space:nowrap;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 4px;background:var(--accent);color:var(--on-accent);border-radius:999px;font-weight:600;font-size:14px;animation:rise-in var(--dur-spring) var(--ease-spring) backwards}
.bubble i{width:28px;height:28px;border-radius:50%;background:var(--sel-fill);box-shadow:var(--gloss);color:var(--on-sel);display:grid;place-items:center}
.bubble i svg{width:14px;height:14px}
.bubble::after{content:"";position:absolute;left:50%;top:100%;width:10px;height:10px;background:var(--accent);border-radius:2px;transform:translate(-50%,-6px) rotate(45deg)}
@keyframes rise-in{from{transform:translateY(10px) scale(.92);opacity:0}}
.node-label{margin-top:12px;font-weight:600;font-size:13px;color:var(--muted);text-align:center;max-width:180px}
.unlock-note{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 0}

/* sheet / dialog */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade-in var(--dur-fade)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:32px 32px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up var(--dur-spring) var(--ease-spring)}
@keyframes up{from{transform:translateY(26px) scale(.97);opacity:0}}
@keyframes fade-in{from{opacity:0}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill-strong);margin:0 auto 16px}
@media (min-width:600px){.scrim{align-items:center;padding:20px}.sheet{max-width:460px;border-radius:32px;padding:24px;box-shadow:var(--shadow-soft)}.grab{display:none}}
.sheet h3{font-size:22px;margin:3px 0 12px}
.sheet p{margin:0 0 12px}
.bar,.qbar{height:8px;background:var(--fill-strong);border-radius:999px;overflow:hidden}
.bar{margin-bottom:12px} .qbar{margin-top:8px}
.bar i,.qbar i{display:block;height:100%;border-radius:999px;background:var(--sel-line);box-shadow:var(--gloss);transition:width var(--dur-calm) var(--ease-calm)}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface-2);border-radius:16px;padding:14px;transition:background-color var(--dur-fade)}
.task.on{background:var(--ok-soft)}
.task .box{position:relative;flex:none;width:26px;height:26px;padding:0;border:0;background:var(--fill-strong);border-radius:9px;display:grid;place-items:center;color:var(--on-sel)}
.task .box::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--sel-fill);box-shadow:var(--gloss);opacity:0;transition:opacity var(--dur-fade)}
.task .box::after{content:"";position:absolute;inset:-10px}
.task .box:active{scale:.82}
.task .box svg{position:relative;width:16px;height:16px;clip-path:inset(0 100% 0 0);transition:clip-path var(--dur-fade)}
.task.on .box::before{opacity:1}
.task.on .box svg{clip-path:inset(0);transition-delay:60ms}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer;font-size:15px}
.task .tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;margin-bottom:4px}
.tag.game{background:color-mix(in oklab,var(--gold) 24%,var(--surface));color:var(--gold-deep)}
.tag.test{background:var(--accent);color:var(--on-accent)}
.tag.opt{background:var(--fill-strong);color:var(--muted)}
.task .xp{margin-left:auto;flex:none;font-weight:600;font-size:13px;color:var(--gold-deep);font-variant-numeric:tabular-nums;line-height:26px}
code{font-size:13px;background:var(--fill-strong);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}
.btn{border:0;border-radius:26px;min-height:52px;padding:8px 16px;font-weight:600;font-size:16px;line-height:1.15;width:100%;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--danger);color:#fff}
.btn:active{scale:.95}
.row{display:flex;gap:8px;margin-top:16px}
.hint{font-size:14px;color:var(--muted);margin:0 0 12px}
.intro ol{list-style:none;margin:0 0 4px;padding:0;counter-reset:paso;display:flex;flex-direction:column;gap:12px}
.intro li{position:relative;padding-left:38px;counter-increment:paso;font-size:15px}
.intro li::before{content:counter(paso);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--surface-2);font-weight:600;font-size:13px;display:grid;place-items:center}

/* diccionario */
.searchbox{display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-soft);color:var(--muted)}
.searchbox:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.searchbox svg{flex:none;width:18px;height:18px}
.search{flex:1;min-width:0;font:inherit;background:transparent;color:var(--fg);border:0;outline:0;padding:0;-webkit-appearance:none;appearance:none}
.search::placeholder{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:14px 16px 10px;scrollbar-width:none}
.chips button{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow-soft);border-radius:999px;height:36px;padding:0 14px;font-weight:600;font-size:14px}
.chips button:active{scale:.95}
.chips button[aria-pressed="true"]{background:var(--sel-fill);box-shadow:var(--gloss);color:var(--on-sel)}
.dict-cat{font-size:13px;font-weight:600;color:var(--muted);margin:18px 0 8px 4px}
.card.glos{padding-block:4px}
.glos details{border-top:1px solid var(--line)}
.glos details:first-of-type{border-top:0}
.glos summary{display:flex;align-items:baseline;gap:8px;list-style:none;font-weight:600;cursor:pointer;padding:14px 0}
.glos summary::-webkit-details-marker{display:none}
.glos summary small{font-weight:500;color:var(--muted);font-size:13px}
.glos summary::after{content:"";flex:none;margin-left:auto;align-self:center;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);border-radius:1px;transform:translateY(-2px) rotate(45deg);transition:transform var(--dur-spring) var(--ease-spring)}
.glos details[open] summary::after{transform:translateY(2px) rotate(225deg)}
.glos p{margin:-4px 0 14px;font-size:15px;color:var(--muted)}
.glos .ex{font-size:14px;color:var(--fg);background:var(--surface-2);border-radius:12px;padding:8px 12px;margin:-4px 0 14px}
@supports (interpolate-size:allow-keywords){
 .glos details{interpolate-size:allow-keywords}
 .glos details::details-content{height:0;overflow:clip;opacity:0;transition:height var(--dur-calm) var(--ease-calm),opacity var(--dur-fade),content-visibility var(--dur-calm) allow-discrete}
 .glos details[open]::details-content{height:auto;opacity:1}
}
.empty{color:var(--muted);text-align:center;padding:20px 0}

/* quests & cards */
.section-h{font-size:22px;margin:28px 0 4px}
main>.section-h:first-child{margin-top:6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--surface);box-shadow:var(--shadow-soft);border-radius:var(--r);padding:16px 18px}
.quest{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.quest:first-child{border-top:0;padding-top:2px} .quest:last-child{padding-bottom:2px}
.quest .q-ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.quest .q-ic svg{width:22px;height:22px;color:#fff}
.quest .q-main{flex:1;min-width:0}
.q-title{font-weight:600}
.q-desc{font-size:13px;color:var(--muted)}
.qbtn{flex:none;border:0;background:var(--surface-2);border-radius:999px;min-width:56px;height:40px;font-weight:600;font-size:14px;padding:0 12px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.qbtn:active{scale:.9}
.qbtn.done{background:var(--sel-fill);box-shadow:var(--gloss);color:var(--on-sel)}
.qbtn.pop{animation:pop var(--dur-spring) var(--ease-spring)}
@keyframes pop{from{transform:scale(.55)}}
.goalpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.goalpick button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:var(--surface);box-shadow:var(--shadow-soft);border-radius:18px;padding:12px 14px;font-weight:600}
.goalpick button:active{scale:.97}
.goalpick small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.goalpick .radio{flex:none;margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--fill-strong);display:grid;place-items:center}
.goalpick .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-sel);scale:0;transition:scale var(--dur-spring) var(--ease-spring)}
.goalpick button[aria-pressed="true"]{background:linear-gradient(90deg,color-mix(in oklab,var(--sel-a) 26%,var(--surface)),color-mix(in oklab,var(--sel-b) 26%,var(--surface)));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--sel-a) 55%,transparent)}
.goalpick button[aria-pressed="true"] .radio{background:var(--sel-fill);box-shadow:var(--gloss)}
.goalpick button[aria-pressed="true"] .radio::after{scale:1}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);box-shadow:var(--shadow-soft);border-radius:24px;padding:14px;display:flex;gap:10px;align-items:center}
.tile svg{width:40px;height:40px;padding:9px;flex:none;border-radius:50%;background:color-mix(in oklab,currentColor 14%,transparent)}
.tile b{display:block;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.week{display:flex;justify-content:space-between;gap:4px;margin-top:10px}
.day{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.day i{display:grid;place-items:center;margin:6px auto 0;width:36px;height:36px;border-radius:50%;background:var(--surface-2)}
.day i.hit{background:var(--sel-fill);box-shadow:var(--gloss);color:var(--on-sel)} .day i.frz{background:var(--ice);color:#fff}
.day i.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.day i svg{width:16px;height:16px}
.lvl{display:flex;align-items:center;gap:14px}

/* library */
.lib-group{margin-top:12px}
.lib-group h3{font-size:17px;margin-bottom:4px}
.lib-item{padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.lib-item:first-of-type{border-top:0}
.lib-item:last-child{padding-bottom:2px}
.lib-item small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px;background:var(--surface-2);color:var(--muted)}

/* tabs: barra flotante con píldora que se desliza */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;pointer-events:none;background:linear-gradient(transparent,var(--bg) 55%);padding:18px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs div{pointer-events:auto;position:relative;max-width:496px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-radius:30px;padding:6px;box-shadow:var(--shadow-knob),var(--shadow-soft)}
.tabs .glide{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:24px;background:var(--surface-2);transform:translateX(calc(var(--i,0)*100%));transition:transform var(--dur-spring) var(--ease-spring)}
.tabs button{position:relative;border:0;background:transparent;border-radius:24px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}
.tabs button:active{scale:.9}
@media (max-width:380px){.tabs button{font-size:10.5px}}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--fg)}

/* toast / celebrate */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);translate:-50% 0;z-index:65;display:flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 8px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-knob),var(--shadow-soft);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;animation:rise-in var(--dur-spring) var(--ease-spring),toast-out var(--dur-fade) 1.5s forwards}
body:has(.scrim) .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 14px)}
.toast i{width:32px;height:32px;border-radius:50%;background:var(--sel-fill);box-shadow:var(--gloss);color:var(--on-sel);display:grid;place-items:center}
.toast i svg{width:16px;height:16px}
@keyframes toast-out{to{opacity:0;transform:translateY(-8px) scale(.94)}}
.celebrate{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));text-align:center;overflow:hidden;animation:fade-in var(--dur-fade)}
.celebrate h2{font-size:30px}
.celebrate .big{width:112px;height:112px;border-radius:50%;background:var(--sel-fill);box-shadow:var(--gloss),var(--shadow-soft);color:var(--on-sel);display:grid;place-items:center;animation:pop var(--dur-spring) var(--ease-spring)}
.celebrate .big svg{width:52px;height:52px}
.celebrate .btn{max-width:340px;position:relative}
.confetti{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.savenote{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
@media (hover:hover){
 .btn:hover{background:color-mix(in oklab,var(--accent),var(--on-accent) 12%)}
 .btn.ghost:hover,.qbtn:not(.done):hover,.unit .info:hover{background:var(--fill-strong)}
 .hero .btn.ghost:hover{background:color-mix(in oklab,var(--on-accent) 22%,transparent)}
 .hero .btn.cyber:hover,.hero .btn.eng:hover{background:var(--sel-fill);filter:brightness(1.06)}
 .btn.danger:hover{background:color-mix(in oklab,var(--danger),#fff 12%)}
 .node:not(:active):hover{scale:1.06}
 .chips button:not([aria-pressed="true"]):hover,.goalpick button:not([aria-pressed="true"]):hover{box-shadow:var(--shadow-knob)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- state ---------- */
const DEFAULT={v:1,xp:0,done:{},unlocked:{},goal:20,sessions:{},seenIntro:0,days:{},streak:0,lastGoal:'',freezes:1,frozen:{},dq:{day:'',done:{}},wq:{week:'',n:{}},track:'cyber'};
let S=structuredClone(DEFAULT), tab='ruta', store=null;
const dkey=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const today=()=>dkey(new Date());
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const diffDays=(a,b)=>{const p=k=>{const [y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const weekKey=()=>{const n=new Date();const day=(n.getDay()+6)%7;return dkey(new Date(n.getFullYear(),n.getMonth(),n.getDate()-day))};

function reconcile(){
  const t=today();
  if(S.dq.day!==t) S.dq={day:t,done:{}};
  if(S.wq.week!==weekKey()) S.wq={week:weekKey(),n:{}};
  if(!S.lastGoal||S.streak===0) return;
  const gap=diffDays(S.lastGoal,t)-1; // full days missed
  if(gap<=0) return;
  if(gap<=S.freezes){
    for(let i=1;i<=gap;i++) S.frozen[addDays(S.lastGoal,i)]=1;
    S.freezes-=gap; S.lastGoal=addDays(t,-1);
  } else { S.streak=0; }
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{ if(store) await store.set(JSON.parse(JSON.stringify(S))); else localStorage.setItem('ruta-analista',JSON.stringify(S)); }catch(e){}
  },500);
}
function gainXP(n){
  const t=today(); S.xp=Math.max(0,S.xp+n); S.days[t]=Math.max(0,(S.days[t]||0)+n);
  if(n>0){
    floatXP('+'+n+' XP');
    if(S.days[t]>=S.goal && S.lastGoal!==t){
      S.streak = (S.lastGoal===addDays(t,-1)) ? S.streak+1 : 1;
      S.lastGoal=t;
      if(S.streak%7===0 && S.freezes<2){S.freezes++;}
      setTimeout(()=>celebrate('¡Meta del día!',`Racha de ${S.streak} ${S.streak===1?'día':'días'}.`+(S.streak%7===0?' Ganaste un protector de racha.':''),I.flame,'var(--flame)'),900);
    }
  }
}

/* ---------- helpers ---------- */
const lessonsOf=tk=>TRACKS[tk].units.flatMap(u=>u.lessons);
const doneCount=l=>l.tasks.filter(t=>S.done[t.id]).length;
const isDone=l=>doneCount(l)===l.tasks.length;
const isOpen=(l,idx,arr)=>idx===0||S.unlocked[l.id]||isDone(arr[idx-1])||doneCount(l)>0;
const taskXP=t=>t.kind==='t'?30:t.kind==='o'?5:10;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function floatXP(txt){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML='<i>'+I.xp+'</i>'+esc(txt);document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const pring=(p,size,label)=>{const r=44,c=2*Math.PI*r;return `<div class="pring" style="--s:${size}px"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bgc" cx="50" cy="50" r="${r}"/><circle class="fgc" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(1,p)))}"${p>0?'':' opacity="0"'}/></svg><b>${label}</b></div>`};

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
function renderTop(){
  $('#t-cyber').setAttribute('aria-pressed',S.track==='cyber');
  $('#t-eng').setAttribute('aria-pressed',S.track==='eng');
  const hit=S.lastGoal===today();
  const st=$('#s-streak'); st.innerHTML=I.flame+S.streak; st.classList.toggle('off',!hit);
  $('#s-freeze').innerHTML=I.ice+S.freezes;
  $('#s-xp').innerHTML=I.xp+S.xp;
  const ts=document.querySelector('.trackswitch'); ts.hidden = tab!=='ruta'; ts.dataset.on=S.track;
  document.querySelector('.tabs div').style.setProperty('--i',['ruta','misiones','biblioteca','diccionario','perfil'].indexOf(tab));
  document.querySelectorAll('.tabs button').forEach(b=>{b.toggleAttribute('aria-current',b.dataset.tab===tab); if(b.dataset.tab===tab) b.setAttribute('aria-current','page');});
}
function render(){
  renderTop();
  const v=$('#view');
  if(tab==='ruta') v.innerHTML=renderPath();
  else if(tab==='misiones') v.innerHTML=renderQuests();
  else if(tab==='biblioteca') v.innerHTML=renderLib();
  else if(tab==='diccionario'){v.innerHTML=renderDict();filterDict();}
  else v.innerHTML=renderProfile();
}
function renderPath(){
  const tk=S.track, all=lessonsOf(tk);
  let firstOpenUndone=all.find((l,i)=>isOpen(l,i,all)&&!isDone(l));
  let html='', gi=0;
  if(firstOpenUndone){
    const l=firstOpenUndone, nt=l.tasks.find(t=>!S.done[t.id]), xpT=Math.min(S.days[today()]||0,S.goal);
    html+=`<section class="hero"><div class="hero-head"><div><div class="eyebrow">Sigue aquí · Unidad ${l.unit}</div><h2>${esc(l.title)}</h2><div class="meta">${doneCount(l)} de ${l.tasks.length} tareas · Hoy ${xpT} de ${S.goal} XP</div></div>${pring(xpT/S.goal,76,`${xpT}<small>/${S.goal}</small>`)}</div>
     <div class="next">${nt.html}</div>
     <div class="row"><button class="btn ghost" data-session="${l.id}">Estudié 25 min</button><button class="btn ${tk}" data-lesson="${l.id}">Abrir</button></div></section>`;
  }
  TRACKS[tk].units.forEach((u,ui)=>{
    html+=`<section class="unit ${tk}"><div class="unit-av" aria-hidden="true">${ui}</div><div class="unit-body"><div class="eyebrow">Unidad ${ui}</div><h2>${esc(u.title)}</h2><p>${esc(u.goal)}</p></div><button class="info" data-tip="${ui}" aria-label="¿De qué va esta unidad?">${I.info}</button></section><div class="path">`;
    u.lessons.forEach((l,li)=>{
      const idx=gi++, open=isOpen(l,idx,all), done=isDone(l), n=doneCount(l), tot=l.tasks.length;
      const off=Math.round(Math.sin(idx*0.9)*70);
      const cls=['node',tk,done?'done':open?'open':'locked',l.test?'test':'',firstOpenUndone===l?'cur':''].join(' ');
      const icon=done?I.check:!open?I.lock:l.test?I.trophy:I.star;
      const r=44,c=2*Math.PI*r,p=n/tot;
      const ring=(open&&!done&&n>0)?`<svg class="ring" viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="${r}"/><circle class="fgc" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 50 50)"/></svg>`:'';
      const bubble=(firstOpenUndone===l)?`<span class="bubble"><i>${I.play}</i>${n?'Seguir':'Empezar'}</span>`:'';
      html+=`<div class="node-wrap" style="transform:translateX(${off}px)">${bubble}<button class="${cls}" data-lesson="${l.id}" aria-label="${esc(l.title)}: ${n} de ${tot}">${ring}${icon.replace('<svg','<svg class="ic"')}</button><div class="node-label">${esc(l.title)}</div></div>`;
    });
    html+='</div>';
  });
  return html;
}
let fresh=null; // misión recién tocada: su botón entra con un rebote
function questRow(q,cur,target,isWeekly){
  const done=cur>=target;
  const btn=isWeekly
    ? `<button class="qbtn ${done?'done':''} ${fresh===q.id?'pop':''}" data-wq="${q.id}" aria-label="Sumar">${done?I.check.replace('<svg','<svg width="20" height="20"'):cur+'/'+target}</button>`
    : `<button class="qbtn ${done?'done':''} ${fresh===q.id?'pop':''}" data-dq="${q.id}" aria-label="${done?'Desmarcar':'Hecho'}">${done?I.check.replace('<svg','<svg width="20" height="20"'):'+'+q.xp}</button>`;
  return `<div class="quest"><div class="q-ic" style="background:${q.color}">${I[q.ic]}</div><div class="q-main"><div class="q-title">${esc(q.title)}</div><div class="q-desc">${q.desc}</div>${isWeekly?`<div class="qbar"><i style="width:${Math.min(100,cur/target*100)}%"></i></div>`:''}</div>${btn}</div>`;
}
function renderQuests(){
  const t=today(), xpToday=S.days[t]||0, pct=Math.min(100,xpToday/S.goal*100);
  return `<h2 class="section-h">Meta del día</h2><p class="sub">Sin horario: cualquier momento del día cuenta. Llega a tu meta y la racha sube.</p>
  <div class="card"><div class="quest"><div class="q-ic" style="background:var(--flame)">${I.flame}</div><div class="q-main"><div class="q-title">${xpToday} de ${S.goal} XP hoy</div><div class="qbar"><i style="width:${pct}%"></i></div></div></div></div>
  <h2 class="section-h">Misiones diarias</h2><p class="sub">Hábitos de inglés. No tienes que hacerlas todas: una o dos ya suman. Se reinician cada día.</p>
  <div class="card">${DAILY.map(q=>questRow(q,S.dq.done[q.id]?1:0,1,false)).join('')}</div>
  <h2 class="section-h">Misiones de la semana</h2><p class="sub">Hazlas el día que puedas. Se reinician el lunes.</p>
  <div class="card">${WEEKLY.map(q=>questRow(q,S.wq.n[q.id]||0,q.target,true)).join('')}</div>`;
}
let dq='', dcat=-1;
function renderDict(){
  return `<h2 class="section-h">Diccionario</h2><p class="sub">${DICT.length} términos de ciberseguridad en palabras simples, con su nombre en inglés.</p>
  <label class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="search" id="dict-q" type="text" inputmode="search" enterkeyhint="search" placeholder="Busca: phishing, puerto, SIEM…" value="${esc(dq)}" autocomplete="off" aria-label="Buscar en el diccionario"></label>
  <div class="chips" role="group" aria-label="Categoría"><button data-dcat="-1" aria-pressed="${dcat===-1}">Todo</button>${DCATS.map((c,i)=>`<button data-dcat="${i}" aria-pressed="${dcat===i}">${esc(c)}</button>`).join('')}</div>
  ${DCATS.map((c,ci)=>`<div data-dgroup="${ci}"><div class="dict-cat">${esc(c)}</div><div class="card glos">${DICT.map((x,i)=>x[2]===ci?`<details data-dterm="${i}"><summary>${esc(x[0])}${x[1]&&x[1]!==x[0]?`<small>${esc(x[1])}</small>`:''}</summary><p>${esc(x[3])}</p>${x[4]?`<div class="ex">Ejemplo: ${esc(x[4])}</div>`:''}</details>`:'').join('')}</div></div>`).join('')}
  <p class="empty" id="dict-empty" hidden>Nada con esa palabra. Prueba en inglés o con otra parecida.</p>`;
}
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function filterDict(){
  const q=norm(dq.trim()); let any=0;
  document.querySelectorAll('[data-dterm]').forEach(el=>{const x=DICT[+el.dataset.dterm];const ok=(dcat===-1||x[2]===dcat)&&(!q||norm(x[0]+' '+x[1]+' '+x[3]).includes(q));el.hidden=!ok;if(ok)any++;if(q&&ok&&norm(x[0]+' '+x[1]).includes(q))el.open=true;});
  document.querySelectorAll('[data-dgroup]').forEach(g=>{g.hidden=!g.querySelector('[data-dterm]:not([hidden])')});
  const e=document.getElementById('dict-empty'); if(e) e.hidden=!!any;
}
document.addEventListener('input',e=>{if(e.target.id==='dict-q'){dq=e.target.value;filterDict()}});
function renderLib(){
  return `<h2 class="section-h">Biblioteca</h2><p class="sub">Si un día no sabes qué hacer, escoge algo de aquí.</p>`+
   LIB.map(g=>`<div class="card lib-group"><h3>${esc(g.h)}</h3>${g.items.map(i=>`<div class="lib-item">${i[0]}${i[2]?`<span class="pill">${esc(i[2])}</span>`:''}<small>${esc(i[1])}</small></div>`).join('')}</div>`).join('');
}
function renderProfile(){
  const lvl=Math.floor(S.xp/150)+1, inLvl=S.xp%150;
  const t=today(); const days=[];
  for(let i=6;i>=0;i--){const k=addDays(t,-i);const d=new Date(k+'T12:00');days.push({k,lab:'LMMJVSD'[(d.getDay()+6)%7],hit:(S.days[k]||0)>=S.goal,frz:!!S.frozen[k]});}
  const cl=lessonsOf('cyber'), el=lessonsOf('eng');
  const cd=cl.filter(isDone).length, ed=el.filter(isDone).length;
  return `<h2 class="section-h">Tu progreso</h2><p class="sub">Sin fechas: avanzas a tu ritmo. Lo que importa es pasar cada prueba.</p>
  <div class="card lvl">${pring(inLvl/150,68,lvl)}<div style="flex:1;min-width:0"><div class="q-title">Nivel ${lvl}</div><div class="q-desc">${S.xp} XP en total · faltan ${150-inLvl} para el nivel ${lvl+1}</div></div></div>
  <div class="stats" style="margin-top:8px">
   <div class="tile" style="color:var(--flame)">${I.flame}<div><b style="color:var(--fg)">${S.streak}</b><span>días de racha</span></div></div>
   <div class="tile" style="color:var(--ice)">${I.ice}<div><b style="color:var(--fg)">${S.freezes}/2</b><span>protectores</span></div></div>
   <div class="tile" style="color:var(--cyber)">${I.shield}<div><b style="color:var(--fg)">${cd}/${cl.length}</b><span>lecciones de ciber</span></div></div>
   <div class="tile" style="color:var(--eng)">${I.talk}<div><b style="color:var(--fg)">${ed}/${el.length}</b><span>lecciones de inglés</span></div></div>
  </div>
  <div class="card" style="margin-top:8px"><div class="q-title">Últimos 7 días</div><div class="week">${days.map(d=>`<div class="day">${d.lab}<i class="${d.hit?'hit':d.frz?'frz':''} ${d.k===t?'today':''}">${d.hit?I.flame:d.frz?I.ice:''}</i></div>`).join('')}</div>
  <p class="hint" style="margin:10px 0 0">Si un día no llegas a la meta, un protector cuida tu racha. Ganas uno cada 7 días de racha, hasta 2.</p></div>
  <h2 class="section-h">Meta diaria</h2><p class="sub">Una tarea da 10 XP, una prueba 30 y cada sesión de 25 min 10. Normal son dos sesiones al día.</p>
  <div class="goalpick" role="group" aria-label="Meta diaria">${[[10,'Suave'],[20,'Normal'],[40,'Seria'],[60,'Intensa']].map(([g,n])=>`<button data-goal="${g}" aria-pressed="${S.goal===g}"><span>${n}<small>${g} XP al día</small></span><i class="radio"></i></button>`).join('')}</div>
  <h2 class="section-h">Reiniciar</h2><p class="sub">Borra todo el progreso de esta app.</p>
  <button class="btn ghost" data-reset="1">Borrar progreso</button>`;
}

function closeSheet(){document.querySelector('.scrim')?.remove()}
function openSheet(inner,keep){const old=keep&&document.querySelector('.scrim .sheet');if(old){old.innerHTML='<div class="grab"></div>'+inner;return old.parentNode} // keep: cambia el contenido sin volver a animar la entrada
  closeSheet();const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div>`;s.addEventListener('click',e=>{if(e.target===s)closeSheet()});document.body.appendChild(s);return s}
function lessonSheet(id,keep){
  const all=lessonsOf(S.track); const idx=all.findIndex(l=>l.id===id); const l=all[idx]; const u=TRACKS[S.track].units[l.unit];
  const open=isOpen(l,idx,all), tk=S.track;
  if(!open){
    const s=openSheet(`<div class="eyebrow" style="color:var(--muted)">Unidad ${l.unit} · ${esc(u.title)}</div><h3>${esc(l.title)}</h3><p class="hint">Se abre cuando termines la lección anterior. Si ya dominas lo anterior, puedes abrirla ya.</p><div class="row"><button class="btn ghost" data-close>Volver</button><button class="btn ${tk}" data-unlock="${l.id}">Abrir igual</button></div>`);
    return;
  }
  const n=doneCount(l), tot=l.tasks.length, col=tk==='cyber'?'var(--cyber)':'var(--eng)';
  const s=openSheet(`<div class="eyebrow" style="color:${col}">Unidad ${l.unit} · ${esc(u.title)}${l.test?' · Prueba':''}</div><h3>${esc(l.title)}</h3>
   <div class="bar"><i style="width:${n/tot*100}%"></i></div>
   <p class="hint" data-count>${n} de ${tot}. El orden es libre.</p>
   <div class="tasks">${l.tasks.map(t=>`<div class="task ${S.done[t.id]?'on':''}"><button class="box" data-task="${t.id}" aria-pressed="${!!S.done[t.id]}" aria-label="Marcar como hecha">${I.check}</button><span class="txt" data-task-txt="${t.id}">${t.kind==='g'?'<span class="tag game">Modo juego</span><br>':t.kind==='t'?'<span class="tag test">Prueba</span><br>':t.kind==='o'?'<span class="tag opt">Opcional</span><br>':''}${t.html}</span><span class="xp">+${taskXP(t)}</span></div>`).join('')}</div>
   <p class="hint" style="margin-top:14px">¿Una tarea larga? No tienes que terminarla hoy. Registra cada rato que estudies y tu racha sigue.</p>
   <div class="row" style="margin-top:0"><button class="btn ghost" data-session="${l.id}">Estudié 25 min · +10</button><button class="btn ${tk}" data-close>Listo</button></div>`,keep);
}
// Tras marcar una tarea: actualiza la hoja abierta en su sitio, para que la casilla y la barra se animen.
function patchLesson(l){
  const sh=document.querySelector('.sheet'); if(!sh) return;
  const n=doneCount(l), tot=l.tasks.length;
  l.tasks.forEach(t=>{const b=sh.querySelector(`[data-task="${t.id}"]`); if(!b) return; const on=!!S.done[t.id]; b.setAttribute('aria-pressed',on); b.closest('.task').classList.toggle('on',on)});
  const bar=sh.querySelector('.bar i'); if(bar) bar.style.width=n/tot*100+'%';
  const c=sh.querySelector('[data-count]'); if(c) c.textContent=`${n} de ${tot}. El orden es libre.`;
}
function tipSheet(ui){const u=TRACKS[S.track].units[ui];openSheet(`<div class="eyebrow" style="color:var(--muted)">Unidad ${ui} · ¿De qué va esto?</div><h3>${esc(u.title)}</h3><p>${esc(u.easy)}</p><p><b>Meta:</b> ${esc(u.goal)}</p>${u.tip?`<p><b>Consejo:</b> ${u.tip}</p>`:''}<p class="hint">¿Una palabra que no entiendes? Búscala en Diccionario, abajo.</p><div class="row"><button class="btn ${S.track}" data-close>Entendido</button></div>`)}
function introSheet(){openSheet(`<div class="intro"><div class="eyebrow" style="color:var(--cyber)">Cómo funciona</div><h3>Estudia cuando puedas, no a una hora fija</h3><ol>
 <li><b>Tienes dos rutas:</b> Ciber e Inglés. Cambia entre ellas arriba a la izquierda.</li>
 <li><b>Toca el círculo que dice Empezar.</b> Cada lección tiene tareas; márcalas cuando las termines, en el orden que quieras.</li>
 <li><b>¿Estudiaste un rato sin terminar nada?</b> Toca "Estudié 25 min". También cuenta.</li>
 <li><b>Llega a tu meta del día</b> y la racha sube. Si fallas un día, un protector la cuida.</li>
 <li><b>¿No entiendes una palabra?</b> Búscala en Diccionario, en la barra de abajo.</li></ol></div>
 <div class="row"><button class="btn cyber" data-intro="1">Empezar</button></div>`)}

function celebrate(title,sub,icon,color){
  const c=document.createElement('div');c.className='celebrate';
  c.innerHTML=`<div class="big">${icon}</div><h2>${esc(title)}</h2><p class="hint" style="font-size:16px;max-width:340px">${esc(sub)}</p><button class="btn ${S.track}" data-celebrate-close>Continuar</button>`;
  const cols=['var(--cyber)','var(--eng)','var(--gold)','var(--ok)','var(--flame)'];
  for(let i=0;i<40;i++){const p=document.createElement('i');p.className='confetti';p.style.left=Math.random()*100+'%';p.style.background=cols[i%5];p.style.animationDuration=(1.6+Math.random()*1.6)+'s';p.style.animationDelay=(Math.random()*.4)+'s';c.appendChild(p)}
  document.body.appendChild(c);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('a')) return; // links open normally
  const dc=e.target.closest('[data-dcat]');if(dc){dcat=+dc.dataset.dcat;document.querySelectorAll('[data-dcat]').forEach(b=>b.setAttribute('aria-pressed',b===dc));filterDict();return}
  const el=e.target.closest('[data-lesson],[data-task],[data-task-txt],[data-session],[data-intro],[data-close],[data-unlock],[data-tip],[data-dq],[data-wq],[data-goal],[data-reset],[data-confirm-reset],[data-celebrate-close],[data-tab],#t-cyber,#t-eng');
  if(!el) return;
  if(el.id==='t-cyber'||el.id==='t-eng'){S.track=el.id==='t-cyber'?'cyber':'eng';save();render();scrollTo(0,0);return}
  if(el.dataset.tab){tab=el.dataset.tab;render();scrollTo(0,0);return}
  if(el.dataset.lesson){lessonSheet(el.dataset.lesson);return}
  if(el.dataset.tip){tipSheet(+el.dataset.tip);return}
  if('close' in el.dataset){closeSheet();return}
  if('celebrateClose' in el.dataset){el.closest('.celebrate').remove();return}
  if(el.dataset.unlock){S.unlocked[el.dataset.unlock]=1;save();render();lessonSheet(el.dataset.unlock,true);return}
  if(el.dataset.intro){S.seenIntro=1;save();closeSheet();return}
  if(el.dataset.session){const t=today();S.sessions[t]=(S.sessions[t]||0)+1;gainXP(10);save();render();if(el.closest('.sheet'))lessonSheet(el.dataset.session,true);return}
  if(el.dataset.task||el.dataset.taskTxt){
    const id=el.dataset.task||el.dataset.taskTxt; const l=lessonsOf(S.track).find(x=>x.tasks.some(t=>t.id===id)); const t=l.tasks.find(t=>t.id===id);
    const was=isDone(l);
    if(S.done[id]){delete S.done[id];gainXP(-taskXP(t))} else {S.done[id]=1;gainXP(taskXP(t))}
    save(); render(); patchLesson(l);
    if(!was&&isDone(l)){closeSheet();gainXP(20);save();render();celebrate(l.test?'¡Prueba superada!':'¡Lección completa!',l.test?`Cerraste la unidad ${TRACKS[S.track].units[l.unit].title}. +20 XP de bonus.`:'+20 XP de bonus. La siguiente lección ya está abierta.',l.test?I.trophy:I.star,'var(--gold)')}
    return;
  }
  if(el.dataset.dq){const q=DAILY.find(q=>q.id===el.dataset.dq);if(S.dq.done[q.id]){delete S.dq.done[q.id];gainXP(-q.xp)}else{S.dq.done[q.id]=1;gainXP(q.xp)}save();fresh=q.id;render();fresh=null;return}
  if(el.dataset.wq){const q=WEEKLY.find(q=>q.id===el.dataset.wq);const cur=S.wq.n[q.id]||0;if(cur>=q.target){S.wq.n[q.id]=0;gainXP(-q.xp)}else{S.wq.n[q.id]=cur+1;if(cur+1>=q.target)gainXP(q.xp)}save();fresh=q.id;render();fresh=null;return}
  if(el.dataset.goal){S.goal=+el.dataset.goal;save();render();return}
  if(el.dataset.reset){openSheet(`<h3>¿Borrar todo el progreso?</h3><p class="hint">Se pierden tus XP, tu racha y las lecciones marcadas. No se puede deshacer.</p><div class="row"><button class="btn ghost" data-close>Cancelar</button><button class="btn danger" data-confirm-reset="1">Borrar</button></div>`);return}
  if(el.dataset.confirmReset){S=structuredClone(DEFAULT);reconcile();save();closeSheet();render();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();document.querySelector('.celebrate')?.remove()}});

/* ---------- boot ---------- */
function boot(saved){
  if(saved&&saved.v===1) S=Object.assign(structuredClone(DEFAULT),JSON.parse(JSON.stringify(saved)));
  reconcile(); render();
  if(!S.seenIntro && !document.querySelector('.scrim')) introSheet();
}
try{const raw=localStorage.getItem('ruta-analista'); boot(raw?JSON.parse(raw):null)}catch(e){boot(null)}
$('#savenote').textContent='Tu progreso se guarda en este navegador.';
(async()=>{
  try{
    const db=await window.claude?.use?.('db'); const user=await window.claude?.use?.('user');
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    store=db.collection('data/users/'+uid).doc('progreso');
    const snap=await store.get();
    if(snap.exists){boot(snap.data());}
    else {save();}
    $('#savenote').textContent='Tu progreso se guarda en tu cuenta: lo ves igual en el Mac y en el iPad.';
  }catch(e){}
})();
</script>
