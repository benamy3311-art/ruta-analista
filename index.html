<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{var t=localStorage.getItem('ruta-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E9E9EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ruta">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
<title>Ruta Analista</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
/* Registro sereno (gusto/GUSTO.md v3): lienzo gris frío → panel gris-lavanda → tarjeta blanca; profundidad por tono.
   Un solo acento: tinta negra en píldora (la acción principal de cada vista). Pasteles solo con significado:
   cielo = Ciber, durazno = Inglés, menta = meta del día cumplida. Una pieza de arte con textura, en Perfil.
   Móvil primero; desde 1000 px, barra lateral sobre el panel. */
:root{
  /* superficies, de atrás hacia delante */
  --lienzo:#E9E9EE; --panel:#DEDDE8; --panel-vidrio:rgba(255,255,255,.55); --tarjeta:#FFFFFF; --hundido:#F3F3F6;
  /* tinta: texto y único acento */
  --tinta:#111114; --tinta-2:#55555F; --tinta-3:#74747F; --linea:rgba(17,17,20,.07); --sobre-tinta:#FFFFFF;
  /* pasteles con significado: fondo / texto encima */
  --cielo:#D3E6FA; --cielo-t:#24476B;
  --durazno:#FBE2C4; --durazno-t:#6E4516;
  --menta:#CFEEDD; --menta-t:#1F5A3C;
  /* estado: solo en texto o icono */
  --error:#D9483E;
  --velo:rgba(17,17,20,.32);
  /* pieza de arte: noche, cielo y durazno (las dos rutas), con tiras y grano */
  --arte-1:#1E2433; --arte-2:#7FA6D6; --arte-3:#F4D2AC;
  --arte-tiras:rgba(17,17,20,.16); --arte-luz:rgba(255,255,255,.14);
  /* radios */
  --r-chip:8px; --r-control:12px; --r-tarjeta:20px; --r-panel:28px; --r-pildora:999px;
  /* sombras frías, casi invisibles */
  --sombra-1:0 1px 2px rgba(20,20,40,.04),0 4px 12px rgba(20,20,40,.04);
  --sombra-2:0 2px 4px rgba(20,20,40,.05),0 12px 32px rgba(20,20,40,.08);
  /* espaciado, base 4 */
  --e1:4px; --e2:8px; --e3:12px; --e4:16px; --e5:20px; --e6:24px; --e8:32px; --e12:48px; --e16:64px;
  /* movimiento */
  --t-micro:120ms; --t-corto:200ms; --t-medio:280ms; --t-largo:600ms;
  --salida:cubic-bezier(.22,1,.36,1); --entrada:cubic-bezier(.55,0,.8,.2); --vaiven:cubic-bezier(.65,0,.35,1); --rebote:cubic-bezier(.34,1.56,.64,1);
  /* tipografía: una familia; la mono solo para comandos y etiquetas técnicas */
  --f:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Geist Mono",ui-monospace,"SF Mono",monospace;
  /* barra inferior del móvil: alto + margen, para colocar lo que flota encima */
  --barra:76px;
  /* pastel de la ruta activa (lo cambia body[data-track]) */
  --p:var(--cielo); --p-t:var(--cielo-t);
  /* sobre la tinta (riel, contadores) */
  --sobre-tinta-2:rgba(255,255,255,.62); --sobre-tinta-sel:rgba(255,255,255,.14); --sobre-tinta-pista:rgba(255,255,255,.18);
  /* anillos del riel: los pasteles de cada ruta, un punto más vivos sobre el negro */
  --anillo-cyber:#8FC0F2; --anillo-eng:#F6BF83;
  /* resplandor del vidrio: lavanda y cielo, muy suaves */
  --brillo-1:rgba(197,186,246,.6); --brillo-2:rgba(170,205,242,.5); --vidrio-arriba:rgba(198,220,234,.85);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --lienzo:#0E0E11; --panel:#17171C; --panel-vidrio:rgba(30,30,36,.62); --tarjeta:#1E1E24; --hundido:#26262D;
  --tinta:#EDEDEF; --tinta-2:#A9A9B4; --tinta-3:#83838F; --linea:rgba(237,237,239,.08); --sobre-tinta:#111114;
  --cielo:color-mix(in oklab,#D3E6FA 20%,#1E1E24); --cielo-t:#D3E6FA;
  --durazno:color-mix(in oklab,#FBE2C4 20%,#1E1E24); --durazno-t:#FBE2C4;
  --menta:color-mix(in oklab,#CFEEDD 20%,#1E1E24); --menta-t:#CFEEDD;
  --error:#EF7A70; --velo:rgba(0,0,0,.6);
  --arte-1:#0B0E16; --arte-2:#3E5F8C; --arte-3:#B98E66;
  --sombra-1:none; --sombra-2:none;
  --sobre-tinta-2:rgba(17,17,20,.6); --sobre-tinta-sel:rgba(17,17,20,.08); --sobre-tinta-pista:rgba(17,17,20,.12);
  --anillo-cyber:#3F78B5; --anillo-eng:#C47A2C;
  --brillo-1:rgba(98,84,170,.28); --brillo-2:rgba(62,100,150,.22); --vidrio-arriba:rgba(62,92,120,.28);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --lienzo:#0E0E11; --panel:#17171C; --panel-vidrio:rgba(30,30,36,.62); --tarjeta:#1E1E24; --hundido:#26262D;
  --tinta:#EDEDEF; --tinta-2:#A9A9B4; --tinta-3:#83838F; --linea:rgba(237,237,239,.08); --sobre-tinta:#111114;
  --cielo:color-mix(in oklab,#D3E6FA 20%,#1E1E24); --cielo-t:#D3E6FA;
  --durazno:color-mix(in oklab,#FBE2C4 20%,#1E1E24); --durazno-t:#FBE2C4;
  --menta:color-mix(in oklab,#CFEEDD 20%,#1E1E24); --menta-t:#CFEEDD;
  --error:#EF7A70; --velo:rgba(0,0,0,.6);
  --arte-1:#0B0E16; --arte-2:#3E5F8C; --arte-3:#B98E66;
  --sombra-1:none; --sombra-2:none;
  --sobre-tinta-2:rgba(17,17,20,.6); --sobre-tinta-sel:rgba(17,17,20,.08); --sobre-tinta-pista:rgba(17,17,20,.12);
  --anillo-cyber:#3F78B5; --anillo-eng:#C47A2C;
  --brillo-1:rgba(98,84,170,.28); --brillo-2:rgba(62,100,150,.22); --vidrio-arriba:rgba(62,92,120,.28);
  color-scheme:dark}
body[data-track="eng"],.cat-eng{--p:var(--durazno); --p-t:var(--durazno-t)}
.cat-cyber{--p:var(--cielo); --p-t:var(--cielo-t)}
.cat-neu{--p:var(--hundido); --p-t:var(--tinta)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--lienzo);color:var(--tinta);font-family:var(--f);font-size:16px;font-weight:400;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--lienzo)}
a{color:inherit;font-weight:500;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in oklab,currentColor 45%,transparent)}
b,strong{font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:0 max(var(--e4),env(safe-area-inset-right,0px)) calc(var(--barra) + 88px + env(safe-area-inset-bottom,0px)) max(var(--e4),env(safe-area-inset-left,0px))}
h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.01em;color:var(--tinta-2)}
.card .eyebrow,.hero .eyebrow,.sheet .eyebrow{color:var(--tinta-3)}
/* pulsar = encoger un poco; sin rebote en lo que se repite */
.btn,.node,.qbtn,.info,.chips button,.goalpick button,.themepick button,.box,.tabs button{transition:transform var(--t-micro) var(--salida)}
.btn:active,.node:active,.qbtn:active,.info:active,.chips button:active,.goalpick button:active,.themepick button:active,.box:active,.tabs button:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--lienzo);display:flex;align-items:center;gap:var(--e4);padding:var(--e3) 0}

/* anillo de progreso: trazo fino, empieza a las 12 */
.pring{position:relative;flex:none;width:var(--s,72px);height:var(--s,72px);display:grid;place-items:center}
.pring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.pring circle{fill:none;stroke-width:var(--tr,5);stroke-linecap:round}
.pring .bgc{stroke:var(--panel)}
.pring .fgc{stroke:var(--tinta);transition:stroke-dashoffset 700ms var(--salida)}
.pring b{position:relative;font-size:calc(var(--s,72px)*.26);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.pring b small{font-size:max(11px,.55em);color:var(--tinta-3);font-weight:500;letter-spacing:0}

/* "sigue aquí": tarjeta blanca sobre el lienzo */
.hero{margin-top:var(--e1);background:var(--tarjeta);box-shadow:var(--sombra-1);border-radius:var(--r-tarjeta);padding:var(--e5)}
.hero-head{display:flex;align-items:center;gap:var(--e4)}
.hero-head>div:first-child{flex:1;min-width:0}
.hero h2{font-size:22px;margin-top:var(--e1)}
.hero .meta{font-size:13px;color:var(--tinta-2);margin-top:var(--e1);font-variant-numeric:tabular-nums}
.hero .next{margin-top:var(--e4);font-size:15px;background:var(--hundido);border-radius:var(--r-chip);padding:var(--e3) var(--e4);overflow-wrap:anywhere}
.hero .next code{background:var(--tarjeta)}
.hero .row{margin-top:var(--e4)}
.hero .solo-pc{display:none}

/* ruta: cada unidad es un panel con sus lecciones */
.unidad{margin-top:var(--e6);background:var(--panel);border-radius:var(--r-panel);padding:var(--e4)}
.unit{display:flex;gap:var(--e3);align-items:flex-start;padding:var(--e1) var(--e1) 0}
.unit-body{flex:1;min-width:0}
.unit h2{font-size:20px;margin-top:var(--e1)}
.unit p{margin:var(--e1) 0 0;font-size:14px;color:var(--tinta-2)}
.unit .info{flex:none;border:0;background:var(--tarjeta);color:var(--tinta);border-radius:50%;width:44px;height:44px;display:grid;place-items:center}
.unit .info svg{width:18px;height:18px}
.path{display:flex;flex-direction:column;align-items:center;gap:var(--e5);padding:var(--e8) 0 var(--e3)}
.node-wrap{display:flex;flex-direction:column;align-items:center}
.node{width:64px;height:64px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;position:relative;background:var(--tarjeta);color:var(--tinta);box-shadow:var(--sombra-1)}
.node svg.ic{width:24px;height:24px}
.node.locked{opacity:.45;box-shadow:none;color:var(--tinta-2)}
.node.done{background:var(--p);color:var(--p-t);box-shadow:none}
.node.test{border-radius:var(--r-tarjeta)}
.ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);pointer-events:none;overflow:visible}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--hundido)}
.ring .fgc{stroke:var(--tinta);stroke-linecap:round}
.node-label{margin-top:var(--e3);font-weight:500;font-size:13px;line-height:1.3;color:var(--tinta-2);text-align:center;max-width:160px}
.node-wrap.cur .node-label{color:var(--tinta);font-weight:600}

/* acción principal en el móvil: píldora negra en la zona del pulgar, encima de la barra */
.cta{position:fixed;z-index:24;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--barra) + var(--e2));translate:-50% 0;display:flex;align-items:center;justify-content:center;gap:var(--e2);height:48px;padding:0 var(--e6);border:0;border-radius:var(--r-pildora);background:var(--tinta);color:var(--sobre-tinta);font-weight:500;font-size:15px;white-space:nowrap;box-shadow:var(--sombra-2);transition:transform var(--t-micro) var(--salida)}
.cta:active{transform:scale(.97)}
.cta svg{width:14px;height:14px}
body:not([data-vista="ruta"]) .cta{display:none}

/* hojas desde abajo */
.scrim{position:fixed;inset:0;background:var(--velo);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade-in var(--t-medio) var(--salida)}
.sheet{background:var(--tarjeta);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:var(--r-panel) var(--r-panel) 0 0;padding:var(--e3) max(var(--e5),env(safe-area-inset-right,0px)) calc(var(--e6) + env(safe-area-inset-bottom,0px)) max(var(--e5),env(safe-area-inset-left,0px));animation:sube var(--t-medio) var(--salida)}
@keyframes sube{from{transform:translateY(24px);opacity:0}}
@keyframes fade-in{from{opacity:0}}
.grab{width:36px;height:4px;border-radius:var(--r-pildora);background:var(--panel);margin:0 auto var(--e4)}
@media (min-width:600px){.scrim{align-items:center;padding:var(--e5)}.sheet{max-width:480px;border-radius:var(--r-panel);padding:var(--e6);box-shadow:var(--sombra-2)}.grab{display:none}}
.sheet h3{font-size:22px;margin:var(--e1) 0 var(--e3)}
.sheet p{margin:0 0 var(--e3)}
.sheet-head{display:flex;align-items:center;gap:var(--e4);margin-bottom:var(--e2)}
.sheet-head>div{flex:1;min-width:0}
.sheet-head h3{margin-bottom:0}
.tasks{display:flex;flex-direction:column}
.task{display:flex;gap:var(--e3);align-items:flex-start;padding:var(--e3) 0;border-top:1px solid var(--linea)}
.task:first-child{border-top:0}
.task .box{position:relative;flex:none;width:24px;height:24px;margin-top:1px;padding:0;border:0;background:transparent;border-radius:var(--r-chip);box-shadow:inset 0 0 0 1.5px var(--tinta-3);display:grid;place-items:center;color:var(--p-t)}
.task .box::after{content:"";position:absolute;inset:-10px}
.task .box svg{width:14px;height:14px;clip-path:inset(0 100% 0 0);transition:clip-path var(--t-corto) var(--salida)}
.task.on .box{background:var(--p);box-shadow:none}
.task.on .box svg{clip-path:inset(0)}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer;font-size:15px}
.task.on .txt{color:var(--tinta-2)}
.tag{display:block;font-family:var(--f-mono);font-size:11px;line-height:14px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:var(--e1)}
.task .xp{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--tinta-3);font-variant-numeric:tabular-nums;line-height:24px}
code{font-family:var(--f-mono);font-size:13px;background:var(--hundido);padding:1px 6px;border-radius:var(--e1);overflow-wrap:anywhere}

/* botones: uno negro por vista; el resto hundido */
.btn{border:0;border-radius:var(--r-pildora);min-height:44px;padding:var(--e2) var(--e5);font-weight:500;font-size:15px;line-height:1.2;width:100%;background:var(--tinta);color:var(--sobre-tinta)}
.btn.ghost{background:var(--hundido);color:var(--tinta)}
.btn.danger{background:var(--hundido);color:var(--error)}
.row{display:flex;gap:var(--e2);margin-top:var(--e4)}
.hint{font-size:14px;color:var(--tinta-2);margin:0 0 var(--e3)}
.intro ol{list-style:none;margin:0 0 var(--e1);padding:0;counter-reset:paso;display:flex;flex-direction:column;gap:var(--e3)}
.intro li{position:relative;padding-left:var(--e8);counter-increment:paso;font-size:15px}
.intro li::before{content:counter(paso);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--hundido);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums;display:grid;place-items:center}

/* diccionario */
.searchbox{display:flex;align-items:center;gap:var(--e3);height:48px;padding:0 var(--e4);border-radius:var(--r-control);background:var(--tarjeta);color:var(--tinta-2)}
.searchbox:focus-within{outline:2px solid var(--tinta);outline-offset:2px}
.searchbox svg{flex:none;width:18px;height:18px}
.search{flex:1;align-self:stretch;min-width:0;font:inherit;font-size:16px;background:transparent;color:var(--tinta);border:0;outline:0;padding:0;-webkit-appearance:none;appearance:none}
.search::placeholder{color:var(--tinta-3)}
.chips{display:flex;gap:var(--e1);overflow-x:auto;margin:0 calc(-1*var(--e4));padding:var(--e3) var(--e4) var(--e1);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;background:transparent;border-radius:var(--r-pildora);height:44px;padding:0 var(--e4);font-weight:500;font-size:14px;color:var(--tinta-2)}
.chips button[aria-pressed="true"]{background:var(--tarjeta);color:var(--tinta);box-shadow:var(--sombra-1)}
.dict-cat{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.01em;color:var(--tinta-2);margin:var(--e5) 0 var(--e2)}
.card.glos{padding-block:0}
.glos details{border-top:1px solid var(--linea)}
.glos details:first-of-type{border-top:0}
.glos summary{display:flex;align-items:baseline;gap:var(--e2);list-style:none;font-weight:600;font-size:15px;cursor:pointer;padding:var(--e4) 0}
.glos summary::-webkit-details-marker{display:none}
.glos summary small{font-weight:400;color:var(--tinta-2);font-size:13px}
.glos summary::after{content:"";flex:none;margin-left:auto;align-self:center;width:7px;height:7px;border-right:1.5px solid var(--tinta-3);border-bottom:1.5px solid var(--tinta-3);transform:translateY(-2px) rotate(45deg);transition:transform var(--t-corto) var(--vaiven)}
.glos details[open] summary::after{transform:translateY(2px) rotate(225deg)}
.glos p{margin:calc(-1*var(--e1)) 0 var(--e4);font-size:15px;color:var(--tinta-2)}
.glos .ex{font-size:14px;color:var(--tinta);background:var(--hundido);border-radius:var(--r-chip);padding:var(--e2) var(--e3);margin:calc(-1*var(--e1)) 0 var(--e4)}
@supports (interpolate-size:allow-keywords){
 .glos details{interpolate-size:allow-keywords}
 .glos details::details-content{height:0;overflow:clip;opacity:0;transition:height var(--t-medio) var(--vaiven),opacity var(--t-corto),content-visibility var(--t-medio) allow-discrete}
 .glos details[open]::details-content{height:auto;opacity:1}
}
.empty{color:var(--tinta-2);text-align:center;padding:var(--e5) 0}

/* secciones y tarjetas */
.section-h{font-size:22px;margin:var(--e8) 0 var(--e1)}
main>.section-h:first-child{margin-top:var(--e2)}
.sub{color:var(--tinta-2);font-size:14px;margin:0 0 var(--e4);max-width:60ch}
.card{background:var(--tarjeta);box-shadow:var(--sombra-1);border-radius:var(--r-tarjeta);padding:var(--e5)}
.cifra{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:var(--e1)}
.cifra small{font-size:14px;font-weight:400;letter-spacing:0;color:var(--tinta-2)}
.meta-dia{display:flex;align-items:center;justify-content:space-between;gap:var(--e4)}
.quest{display:flex;align-items:center;gap:var(--e3);padding:var(--e3) 0;border-top:1px solid var(--linea)}
.quest:first-child{border-top:0;padding-top:0} .quest:last-child{padding-bottom:0}
.q-ic{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:var(--p-t)}
.q-ic svg{width:18px;height:18px}
.q-main{flex:1;min-width:0}
.q-title{font-weight:600;font-size:15px}
.q-desc{font-size:13px;color:var(--tinta-2)}
.qbtn{flex:none;border:0;background:var(--hundido);color:var(--tinta);border-radius:var(--r-pildora);min-width:56px;height:44px;font-weight:500;font-size:14px;padding:0 var(--e4);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.qbtn.done{background:var(--p);color:var(--p-t)}
.qbtn svg{width:18px;height:18px}
.qbtn.pop{animation:asienta var(--t-medio) var(--rebote)}
@keyframes asienta{from{transform:scale(.96)}}

/* selectores segmentados: pista del panel, elegido = píldora blanca */

.tabs .glide{position:absolute;top:var(--e1);bottom:var(--e1);left:var(--e1);width:calc((100% - 2*var(--e1))/5);border-radius:var(--r-pildora);background:var(--tarjeta);box-shadow:var(--sombra-1);transform:translateX(calc(var(--i,0)*100%));transition:transform var(--t-medio) var(--vaiven)}

/* aviso: píldora negra temporal, abajo al centro */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--barra) + 64px);translate:-50% 0;z-index:65;display:flex;align-items:center;gap:var(--e2);height:40px;padding:0 var(--e4);border-radius:var(--r-pildora);background:var(--tinta);color:var(--sobre-tinta);box-shadow:var(--sombra-2);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;animation:toast-in var(--t-medio) var(--rebote),toast-out var(--t-corto) var(--entrada) 1.5s forwards}

/* logro: pantalla serena, el icono se asienta con un solo sobrepaso */
.celebrate{position:fixed;inset:0;z-index:70;background:var(--lienzo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--e4);padding:var(--e6) max(var(--e6),env(safe-area-inset-right,0px)) var(--e6) max(var(--e6),env(safe-area-inset-left,0px));text-align:center;animation:fade-in var(--t-medio) var(--salida)}

const EASY={cyber:[
 'Abres las cuentas que vas a usar y pruebas tu primer reto. No necesitas saber nada todavía.',
 'Una red es la forma en que los equipos se hablan. Aprendes qué pasa cuando abres una página: direcciones (IP), nombres (DNS) y mensajes (TCP, HTTP). Es la base de todo lo demás.',
 'Linux es el sistema que usan casi todos los servidores. Aprendes a manejarlo escribiendo comandos en la terminal, sin mouse. Bandit es un juego donde cada nivel te obliga a usar un comando nuevo.',
 'Aprendes cómo atacan y cómo se defienden los sistemas: contraseñas, cifrado, virus y firewalls. Al final presentas el CCST, una certificación básica de Cisco.',
 'Security+ es el certificado que más piden las empresas para un primer trabajo en seguridad. Repasas todo lo de la unidad anterior con más profundidad y presentas el examen.',
 'Aprendes cómo se rompen las páginas web y las apps del celular, atacándolas en laboratorios legales, y cómo se ven esos ataques en los logs. Es lo que más piden los expertos que te asesoran.',
 'Un analista SOC vigila las alertas de seguridad de una empresa, decide cuáles son ataques reales e informa. Aquí practicas ese trabajo en simuladores y empiezas a postularte.',
 'Aprendes a programar lo justo en Python para que el computador haga el trabajo repetitivo: leer logs, consultar bases de amenazas y armar reportes.',
 'La nube son computadores de otras empresas, como Microsoft o Amazon, donde hoy viven los datos. Aprendes a protegerlos y sacas dos certificaciones de Microsoft.',
 'Aprendes a usar la IA en tu trabajo sin creerle a ciegas, y cómo se atacan y se protegen los sistemas de IA. Es la habilidad más pedida hoy.',
 'Armas tu propio laboratorio, simulas ataques y creas las alertas que los detectan. Es el salto de analista que revisa a analista que construye.'
],eng:[
 'Haces una prueba gratis de 50 minutos para saber tu nivel real de inglés.',
 'Repaso rápido de lo básico. Si algo ya lo sabes, sáltalo: la idea es tapar huecos, no empezar de cero.',
 'Consolidas el inglés intermedio alto y aprendes el vocabulario de ciberseguridad.',
 'C1 es inglés avanzado: argumentar, presentar y entender sin esfuerzo. Es el nivel que piden muchos trabajos remotos.'
]};
for(const tk in EASY) EASY[tk].forEach((t,i)=>TRACKS[tk].units[i].easy=t);
// stable ids
for(const tk of Object.keys(TRACKS)) TRACKS[tk].units.forEach((u,ui)=>u.lessons.forEach((l,li)=>{l.id=`${tk}-${ui}-${li}`;l.unit=ui;l.track=tk;l.tasks=l.tasks.map((t,ti)=>({id:`${l.id}-${ti}`,html:t[0],kind:t[1]||''}));}));

/* ---------- state ---------- */
const DEFAULT={v:1,xp:0,done:{},unlocked:{},goal:20,sessions:{},seenIntro:0,days:{},streak:0,lastGoal:'',freezes:1,frozen:{},dq:{day:'',done:{}},wq:{week:'',n:{}},track:'cyber'};
let S=structuredClone(DEFAULT), tab='ruta', store=null;
const dkey=d=>{const z=new Date(d);return z.getFullYear()+'-'+String(z.getMonth()+1).padStart(2,'0')+'-'+String(z.getDate()).padStart(2,'0')};
const today=()=>dkey(new Date());
const addDays=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const diffDays=(a,b)=>{const p=k=>{const [y,m,d]=k.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};
const weekKey=()=>{const n=new Date();const day=(n.getDay()+6)%7;return dkey(new Date(n.getFullYear(),n.getMonth(),n.getDate()-day))};

function reconcile(){
  const t=today();
  if(S.dq.day!==t) S.dq={day:t,done:{}};
  if(S.wq.week!==weekKey()) S.wq={week:weekKey(),n:{}};
  if(!S.lastGoal||S.streak===0) return;
  const gap=diffDays(S.lastGoal,t)-1; // full days missed
  if(gap<=0) return;
  if(gap<=S.freezes){
    for(let i=1;i<=gap;i++) S.frozen[addDays(S.lastGoal,i)]=1;
    S.freezes-=gap; S.lastGoal=addDays(t,-1);
  } else { S.streak=0; }
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{ if(store&&store.mirror) localStorage.setItem('ruta-analista',JSON.stringify(S)); }catch(e){}
    try{ if(store) await store.set(JSON.parse(JSON.stringify(S))); else localStorage.setItem('ruta-analista',JSON.stringify(S)); }catch(e){}
  },500);
}
function gainXP(n){
  const t=today(); S.xp=Math.max(0,S.xp+n); S.days[t]=Math.max(0,(S.days[t]||0)+n);
  if(n>0){
    floatXP('+'+n+' XP');
    if(S.days[t]>=S.goal && S.lastGoal!==t){
      S.streak = (S.lastGoal===addDays(t,-1)) ? S.streak+1 : 1;
      S.lastGoal=t;
      if(S.streak%7===0 && S.freezes<2){S.freezes++;}
      setTimeout(()=>celebrate('¡Meta del día!',`Racha de ${S.streak} ${S.streak===1?'día':'días'}.`+(S.streak%7===0?' Ganaste un protector de racha.':''),I.flame,'racha'),900);
    }
  }
}

/* ---------- helpers ---------- */
const lessonsOf=tk=>TRACKS[tk].units.flatMap(u=>u.lessons);
const doneCount=l=>l.tasks.filter(t=>S.done[t.id]).length;
const isDone=l=>doneCount(l)===l.tasks.length;
const isOpen=(l,idx,arr)=>idx===0||S.unlocked[l.id]||isDone(arr[idx-1])||doneCount(l)>0;
const taskXP=t=>t.kind==='t'?30:t.kind==='o'?5:10;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function floatXP(txt){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML=I.xp+esc(txt);document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const pctTrack=tk=>{const ts=lessonsOf(tk).flatMap(l=>l.tasks);return ts.filter(t=>S.done[t.id]).length/ts.length};
const miniRing=(p,tk)=>{const r=42,c=2*Math.PI*r;return `<svg class="anillo" viewBox="0 0 100 100" aria-hidden="true"><circle class="pista" cx="50" cy="50" r="${r}"/><circle class="valor ${tk}" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 50 50)"${p>0?'':' opacity="0"'}/></svg>`};
const pring=(p,size,label)=>{const r=44,c=2*Math.PI*r;return `<div class="pring" style="--s:${size}px;--tr:${(350/size).toFixed(1)}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bgc" cx="50" cy="50" r="${r}"/><circle class="fgc" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(1,p)))}"${p>0?'':' opacity="0"'}/></svg><b>${label}</b></div>`};

  const pend=DAILY.filter(q=>!S.dq.done[q.id]).length, cm=$('#c-misiones'); cm.hidden=!pend; cm.textContent=pend; cm.title=pend+' misiones de hoy pendientes';

addEventListener('resize',()=>renderTop());
let cta=null; // lección que abre la píldora negra del móvil
function render(enter){
  renderTop();
  document.body.dataset.track=S.track; document.body.dataset.vista=tab;
  const v=$('#view'); cta=null;
  v.classList.remove('entra'); if(enter){void v.offsetWidth; v.classList.add('entra');}
  if(tab==='ruta') v.innerHTML=renderPath();
  else if(tab==='misiones') v.innerHTML=renderQuests();
  else if(tab==='biblioteca') v.innerHTML=renderLib();

}
function renderPath(){
  const tk=S.track, all=lessonsOf(tk);
  let firstOpenUndone=all.find((l,i)=>isOpen(l,i,all)&&!isDone(l));
  const h=new Date().getHours(), xpHoy=S.days[today()]||0, falta=Math.max(0,S.goal-xpHoy);
  let html=`<section class="saludo"><div><div class="eyebrow">${new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})}</div><h1>${h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches'}</h1><p class="sub">${falta?`Te faltan ${falta} XP para tu meta de hoy.`:'Meta del día cumplida. La racha sigue.'}</p></div>
   <div class="saludo-cifras"><div><div class="eyebrow">Racha</div><div class="cifra">${S.streak}<small> ${S.streak===1?'día':'días'}</small></div></div><div><div class="eyebrow">Hoy</div><div class="cifra">${xpHoy}<small> de ${S.goal} XP</small></div></div></div></section>`, gi=0;

  document.addEventListener('click',async e=>{
    const el=e.target.closest('[data-login],[data-logout],[data-skip-login]'); if(!el) return;
    if(el.dataset.skipLogin){ try{localStorage.setItem('ruta-login-skip','1')}catch(_){} closeSheet(); return; }
    if(el.dataset.logout){
      try{ localStorage.setItem('ruta-analista',JSON.stringify(S)); }catch(_){}
      store=null; await signOut(auth); return;
    }
    if(busy) return; busy=true; err=''; refresh();
    try{ await signInWithPopup(auth,new GoogleAuthProvider()); closeSheet(); }
    catch(ex){ err=(ex&&ex.code==='auth/popup-blocked')?'El navegador bloqueó la ventana de Google. Permítela y vuelve a intentar.':(ex&&ex.code==='auth/popup-closed-by-user'||ex&&ex.code==='auth/cancelled-popup-request')?'':'No se pudo entrar. Intenta de nuevo.'; }
    busy=false; refresh();
  });
  onAuthStateChanged(auth,async u=>{
    me=u;
    if(!u){ store=null; note('Tu progreso se guarda en este navegador. Entra con Google para verlo en todos tus dispositivos.'); refresh();
      let skipped=false; try{skipped=!!localStorage.getItem('ruta-login-skip')}catch(_){}
      if(!skipped && !document.querySelector('.scrim')) loginSheet();
      return; }
    try{
      const ref=doc(db,'users',u.uid);
      const snap=await getDoc(ref);
      store={mirror:true,set:d=>setDoc(ref,d)};
      // Si ya hay avance en la nube y es mayor o igual al de este navegador, manda la nube; si no, se sube el de este navegador.
      if(snap.exists() && (snap.data().xp||0)>=S.xp) boot(snap.data()); else save();
      note('Tu progreso se guarda en tu cuenta ('+(u.email||'Google')+'): lo ves igual en todos tus dispositivos.');
    }catch(ex){ store=null; note('No se pudo conectar con tu cuenta; tu progreso sigue guardado en este navegador.'); }
    refresh();
  });
 }catch(ex){ /* sin red o bloqueado: la app sigue funcionando con guardado local */ }
}
</script>

<script>if('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.claude) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
